name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm run api

      # Vite base must match where the browser loads the app from. Custom domain
      # (CNAME → anyforms.ru) serves the site at /, but the old formula always used
      # /repo-name/ and broke assets (white screen). Override: repo variable VITE_BASE.
      - name: Resolve Vite base path
        id: vite_base
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.VITE_BASE }}" ]; then
            echo "value=${{ vars.VITE_BASE }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f public/CNAME ] && ! grep -qiE 'github\.io' public/CNAME 2>/dev/null; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "value=/${REPO}/" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE: ${{ steps.vite_base.outputs.value }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
