name: deploy-server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server-main
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yanisderbikov/anyforms-front
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Vite-переменные вшиваются в бандл при сборке; если repository variable
      # VITE_GTM_ID не задана (Settings → Secrets and variables → Actions →
      # Variables), образ соберётся без GTM — предупреждаем об этом явно.
      - name: Check analytics config
        run: |
          if [ -z "${{ vars.VITE_GTM_ID }}" ]; then
            echo "::warning::Repository variable VITE_GTM_ID не задана — прод соберётся БЕЗ GTM-аналитики"
          else
            echo "VITE_GTM_ID=${{ vars.VITE_GTM_ID }}"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://anyforms.ru' }}
            VITE_GTM_ID=${{ vars.VITE_GTM_ID || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
